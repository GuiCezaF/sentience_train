schema: training-config/v2
data:
  csv_path: ../data/raw/fer2013.csv
  classes: [angry, happy, neutral, sad]
model:
  architectures: [DS-CNN, MobileNetV3-Small, ResNet-18]
  weights_dir: ../models/pretrained
  num_classes: 4
training:
  batch_size: 128
  workers: auto
  device: cuda:0
  amp: true
  tf32: true
  cudnn_benchmark: true
  channels_last: true
  optimizer: AdamW
  weight_decay: 0.0001
  triage_epochs: 60
  triage_patience: 10
  full_epochs: 100
  full_patience: 15
gates:
  accuracy: 0.65
  macro_f1: 0.65
  min_recall: 0.55
  max_onnx_bytes: 52428800
  max_p95_ms: 10.0
  max_rss_increment_bytes: 134217728
  parity_atol: 0.00001
  parity_rtol: 0.0001
output:
  runs_dir: ../artifacts/runs
  campaigns_dir: ../artifacts/campaigns
  exports_dir: ../artifacts/exports
