[project]
name = "sentience-train"
version = "0.1.0"
description = "Deterministic FER2013 training foundation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.scripts]
sentience-train = "sentience_train.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]
export = [
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "litert-torch==0.9.2",
  "ai-edge-quantizer-nightly==0.8.0.dev20260708",
  "ai-edge-litert==2.1.6",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentience_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
