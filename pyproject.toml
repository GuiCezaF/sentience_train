[project]
name = "sentience-train"
version = "2.0.0"
description = "Deterministic FER2013 training foundation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "psutil>=5.9",
  "py-cpuinfo>=9.0",
]

[project.scripts]
sentience-train = "sentience_train.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12", "mypy>=1.16", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentience_train"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["acceptance: requires the real run and exact benchmark host"]
addopts = "-ra --junitxml=reports/junit.xml -m 'not acceptance'"
pythonpath = ["src", "tests"]
junit_family = "xunit2"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["attr-defined", "arg-type", "assignment", "import-untyped", "name-defined", "union-attr"]
